[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algal-bloom-forecast"
version = "0.1.0"
description = "Research tools for forecasting harmful algal blooms in western Lake Erie."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
]

[project.optional-dependencies]
data = [
    "geopandas",
    "netcdf4",
    "rasterio",
    "shapely",
    "xarray",
]
models = [
    "lightgbm",
    "torch",
    "xgboost",
]
viz = [
    "matplotlib",
    "plotly",
]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algal_bloom_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
