project: algal-bloom-forecast
region: western_lake_erie

forecast:
  horizons_days: [1, 3, 7, 14]
  target: bloom_intensity
  forecast_origin_rule: feature_timestamp

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  timezone: UTC
  alignment:
    predictor_cutoff: target_date_minus_horizon
    missing_target_policy: preserve_null
    interpolation: disabled
  features:
    lag_days: [1, 3, 7]
    rolling_windows_days: [3, 7, 14]
    seasonal_encoding: day_of_year_sin_cos
    missingness: preserve_null_and_source_valid_counts

evaluation:
  split_strategy: held_out_year
  validation_years: [2023]
  test_years: [2024]
  random_seed: 42
  target_field: ci_sum
  baselines: [climatology, persistence, trend, linear]
  gradient_boosted:
    learning_rate: 0.05
    max_iter: 100
    max_leaf_nodes: 7
    l2_regularization: 1.0
    early_stopping: false
    random_state: 42
  linear_features:
    - usgs_maumee_discharge_m3s
    - seasonal_day_of_year_sin
    - seasonal_day_of_year_cos
  feature_ablation_groups: [seasonal_only, discharge_seasonal, buoy_weather, water_quality, combined_core]
  event_definition:
    target_field: ci_sum
    threshold_policy: train_quantile
    train_quantile: 0.75
    probability_policy: hard_thresholded_score
