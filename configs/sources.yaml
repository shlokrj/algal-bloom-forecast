project: algal-bloom-forecast

sources:
  noaa_western_lake_erie_satellite:
    role: target
    provider: NOAA NCCOS
    status: inspect
    catalog_url: https://coastalscience.noaa.gov/science-areas/habs/hab-monitoring-system/cyanobacteria-algal-bloom-from-satellite-in-western-lake-erie-basin/
    explorer_url: https://app.coastalscience.noaa.gov/habs_explorer/
    explorer_directory: data/web/olci_western_le/tif_archive
    product_family: CI-CIcyano.WesternLErie GeoTIFF
    sample_filename_pattern: '^sentinel-3\..*\.CI-CIcyano\.WesternLErie\.tif$'
    timestamp_semantics: filename calendar date validated; acquisition timezone unconfirmed
    target_missing_rule: no_valid_pixels becomes a missing target; do not interpolate
    historical_accessions:
      - '0172375'
      - '0183933'
      - '0209038'
      - '0239146'
      - '0279234'
      - '0279446'
      - '0288351'
      - '0299571'
    historical_target_accession: '0312614'
    historical_target_ftp_root: ftp://ftp-oceans.ncei.noaa.gov/nodc/archive/arc0243/0312614/1.1/data/0-data/HAB_GreatLakes_Monitoring/intensity-extent-timeseries-csvs/GLErie/
    historical_target_metrics: ci_sum and bloom_area_sqkm from Western Lake Erie_fused
    historical_target_semantics: cross-sensor fused 10-day composite center date; no timezone; preserve seasonal gaps and missing values
    historical_target_unit_status: CIcyano products are treated as dimensionless in current Lake Erie products; this historical summed ci_sum aggregate has no explicit unit statement
    historical_target_unit_reference: https://repository.library.noaa.gov/view/noaa/72849/noaa_72849_DS1.pdf
    current_raster_units: dimensionless (dl)
    current_raster_scaling: 10**(3.0 / 250.0 * DN - 4.2)
    current_raster_valid_dn_range: [1, 249]
    current_raster_invalid_dn_codes:
      0: nodetect
      250: saturated
      251: ci_adjacency
      252: land
      253: cloud
      254: mixed_pixel
      255: nodata
    current_raster_grid:
      crs: EPSG:32617
      width: 351
      height: 294
      pixel_size_m: 300
    current_raster_missing_policy: retain raw DN and set decoded intensity to NaN where valid_mask is zero
    notes: Keep the current daily CI-CIcyano GeoTIFF target separate from the historical 10-day fused target until product calibration and temporal alignment are explicitly defined.

  noaa_glerl_ciglr_water_quality:
    role: predictors
    provider: NOAA GLERL and University of Michigan CIGLR via NCEI
    status: inspect
    landing_url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.nodc:GLERL-CIGLR-HAB-LakeErie-water-qual
    doi: https://doi.org/10.25921/11da-3x54
    sample_accession: 0303633
    sample_subset: fluoroprobe_depth_profiles
    sample_ftp_root: ftp://ftp-oceans.ncei.noaa.gov/nodc/archive/arc0231/0303633/1.1/data/0-data/
    time_basis: Eastern Daylight Time as documented by the data dictionary
    collection_accessions:
      - '0187718'
      - '0190201'
      - '0190729'
      - '0194301'
      - '0194302'
      - '0209116'
      - '0254720'
      - '0276355'
      - '0292222'
      - '0293514'
      - '0303633'
    listed_moored_series_status: annual_summary files in accessions 0190201, 0190729, 0194301, and 0194302 are continuous logger series; verify any additional buoy products separately
    earliest_date: 2012-05-15
    seasonal_coverage: May-October
    dataset_spatial_bbox:
      north: 43.3
      south: 41.8
      east: -82.8
      west: -83.7084
    dataset_revision_date: 2025-07-03
    dataset_update_status: ongoing
    station_coordinate_bbox:
      north: 41.834
      south: 41.617
      east: -83.009
      west: -83.424
    notes: Profile discrete sampling and moored-buoy subsets separately; do not treat them as one homogeneous series.

  usgs_maumee_daily_discharge:
    role: predictors
    provider: USGS
    status: ready
    api_url: https://api.waterdata.usgs.gov/ogcapi/v0/collections/daily/items
    monitoring_location_id: USGS-04193500
    parameter_code: '00060'
    statistic_id: '00003'
    expected_unit: ft^3/s
    coverage_start: 2012-01-01
    coverage_end: 2025-12-31

  noaa_ndbc_45005_standard_meteorology:
    role: predictors
    provider: NOAA National Data Buoy Center
    status: ready
    station: '45005'
    station_name: WEST ERIE - 16 NM NW of Lorain, OH
    historical_url_template: https://www.ndbc.noaa.gov/data/historical/stdmet/45005h{year}.txt.gz
    time_basis: UTC
    historical_coverage: 2012-2024 requested; unavailable years are recorded in the immutable history manifest
    notes: Parse the raw ten-minute standard meteorological record and preserve NDBC missing-value sentinels as nulls.
